<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Contador HyperDeck</title>
<style>
  :root{--fg:#fff;--dim:#8a8a8a;--ok:#2fd36b;--warn:#ffb020;--bad:#ff3b30}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #app{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4vh 4vw;gap:3vh}
  #estado{font-size:clamp(14px,3.5vw,24px);letter-spacing:.25em;font-weight:700;color:var(--dim);display:flex;align-items:center;gap:.6em}
  #punto{width:.8em;height:.8em;border-radius:50%;background:var(--dim)}
  #estado.play{color:var(--ok)} #estado.play #punto{background:var(--ok)}
  #estado.rec{color:var(--bad)} #estado.rec #punto{background:var(--bad)}
  #estado.off{color:var(--bad)}
  #clip{font-size:clamp(20px,6vw,56px);font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #indice{font-size:clamp(12px,3vw,20px);color:var(--dim);margin-top:-2vh}
  #tiempo{font-family:"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums;font-weight:700;line-height:1;font-size:min(19vw,28vh)}
  #tiempo.warn{color:var(--warn)} #tiempo.bad{color:var(--bad)}
  #tiempo.blink{animation:b .5s steps(1) infinite}
  @keyframes b{50%{opacity:.25}}
  #barra{width:92%;height:1.2vh;min-height:8px;background:#222;border-radius:99px;overflow:hidden}
  #relleno{height:100%;width:0;background:var(--ok)}
  #duracion{font-size:clamp(13px,3.5vw,24px);color:var(--dim);font-variant-numeric:tabular-nums}
  #tabs{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#111;border:1px solid #2a2a2a;border-radius:99px;padding:4px;z-index:5}
  #tabs a{cursor:pointer;color:#888;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.15em;padding:6px 16px;border-radius:99px}
  #tabs a.on.vtr{background:var(--ok);color:#000} #tabs a.on.rec{background:var(--bad);color:#fff}
  body.rec #tiempo{color:#fff} body.rec.grabando #tiempo{color:var(--bad)}
  #ctl{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;white-space:nowrap}
  #ctl button{background:#151515;color:#ccc;border:1px solid #333;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
  #ajTxt{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:11px;color:#777}
  #sync{letter-spacing:.05em}
  #sync.ok{color:var(--ok);border-color:#1f5d39} #sync.trabajando{opacity:.6}
  #pie{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#444}
  #sinCanal{display:none;text-align:center;padding:30px;font-size:18px;line-height:1.5}
  #sinCanal input{display:block;margin:16px auto;width:min(80vw,320px);font-size:18px;padding:10px;background:#111;color:#fff;border:1px solid #444;border-radius:8px;text-align:center}
  #sinCanal button{font-size:16px;padding:10px 18px;border:0;border-radius:8px;background:var(--ok);color:#000;font-weight:700}
</style>
</head>
<body>
<div id="tabs"><a id="tVtr" class="vtr">VTR</a><a id="tRec" class="rec">REC</a></div>
<div id="app">
  <div id="estado"><span id="punto"></span><span id="estadoTxt">CONECTANDO…</span></div>
  <div id="clip">—</div>
  <div id="indice"></div>
  <div id="tiempo">--:--:--</div>
  <div id="barra"><div id="relleno"></div></div>
  <div id="duracion"></div>
</div>
<div id="sinCanal">
  Escanea el QR del computador del estudio<br>o escribe el código del canal:
  <input id="canalInput" placeholder="hd-xxxxxx">
  <button id="canalBtn">Ver contador</button>
</div>
<div id="ctl"><button id="menos" title="Atrasar 1 cuadro">−1</button><button id="sync" title="Ajusta el reloj de esta pantalla al del estudio">⟳ Sincronizar</button><button id="mas" title="Adelantar 1 cuadro">+1</button><span id="ajTxt"></span></div>
<div id="pie"></div>

<script src="../js/config.js?v=202611192100"></script>
<script src="../js/hyperdeck.js?v=202611192100"></script>
<script>
(function () {
  function param(n) { var m = new RegExp("[?&]" + n + "=([^&]+)").exec(location.search); return m ? decodeURIComponent(m[1]) : ""; }
  var CANAL = param("c");
  var MODO = param("d") || (function () { try { return localStorage.getItem("hd_modo"); } catch (e) { return ""; } })();
  MODO = MODO === "rec" ? "rec" : "vtr";
  var $ = function (id) { return document.getElementById(id); };
  var HD = window.CG && CG.HD;

  if (!CANAL || !HD) {
    $("app").style.display = "none"; $("sinCanal").style.display = "block";
    $("canalBtn").onclick = function () { var v = $("canalInput").value.trim(); if (v) location.search = "?c=" + encodeURIComponent(v); };
    return;
  }
  var con = HD.escuchar(CANAL);

  /* escribir en pantalla solo si cambió (más fluido en celulares y TVs) */
  var cache = {};
  function txt(id, v) {
    if (cache[id] === v) { return; }
    cache[id] = v; $(id).textContent = v;
    if (id === "tiempo") { var n = Math.max(8, v.length); estilo("tiempo", "fontSize", "min(" + (150 / n).toFixed(1) + "vw, 28vh)"); }  /* siempre cabe */
  }
  function cls(id, v) { var k = id + "#c"; if (cache[k] !== v) { cache[k] = v; $(id).className = v; } }
  function estilo(id, prop, v) { var k = id + "#" + prop; if (cache[k] !== v) { cache[k] = v; $(id).style[prop] = v; } }
  function estado(t, c) { txt("estadoTxt", t); cls("estado", c || ""); }

  function dibujarRec() {
    var r = con.rec(), edad = con.edad("rec");
    estilo("barra", "display", "none"); txt("indice", "");
    if (!r || edad > 4000) { estado(r ? "SIN SEÑAL DEL ESTUDIO" : "ESPERANDO AL ESTUDIO…", "off"); txt("tiempo", "--:--:--"); txt("clip", "Grabación"); txt("duracion", ""); document.body.className = "rec"; return; }
    if (r.sinhd) { estado("SIN CONEXIÓN CON EL REC", "off"); txt("tiempo", "--:--:--"); return; }
    document.body.className = "rec" + (r.grabando ? " grabando" : "");
    estado(r.grabando ? "GRABANDO" : "DETENIDO", r.grabando ? "rec" : "");
    txt("clip", r.grabando ? "Duración de la grabación" : "Última grabación");
    txt("tiempo", HD.hms(r.seg)); cls("tiempo", "");
    txt("duracion", r.tc ? "Timecode " + r.tc : "");
  }

  function dibujarVtr() {
    document.body.className = ""; estilo("barra", "display", "");
    var d = con.ultimo("vtr"), edad = con.edad("vtr"), c = con.vtr();
    if (!d || edad > 4000) { estado(d ? "SIN SEÑAL DEL ESTUDIO" : "ESPERANDO AL ESTUDIO…", "off"); if (!d) { return; } }
    else if (d.estado === "sinhd") { estado("SIN CONEXIÓN CON EL VTR", "off"); }
    else if (d.estado === "rec") { estado("GRABANDO", "rec"); }
    else if (d.estado === "vivo") { estado("ENTRADA EN VIVO", ""); }
    else if (c && c.corre) { estado("AL AIRE", "play"); }
    else { estado("DETENIDO", ""); }
    if (!c) {
      txt("clip", d.total === 0 ? "Sin clips en la lista" : "—"); txt("indice", ""); txt("tiempo", "--:--:--");
      cls("tiempo", ""); estilo("relleno", "width", "0%"); txt("duracion", ""); return;
    }
    var seg = c.restante / c.fps;
    txt("clip", c.nombre);
    txt("indice", "Clip " + (c.idx + 1) + " de " + c.total);
    txt("tiempo", "-" + HD.fmt(c.restante, c.fps));
    cls("tiempo", seg <= 10 ? (c.corre ? "bad blink" : "bad") : (seg <= 30 ? "warn" : ""));
    estilo("relleno", "width", Math.min(100, Math.max(0, (c.frames - c.restante) / c.frames * 100)).toFixed(2) + "%");
    estilo("relleno", "background", seg <= 10 ? "var(--bad)" : (seg <= 30 ? "var(--warn)" : "var(--ok)"));
    txt("duracion", "Duración " + HD.fmt(c.frames, c.fps));
  }
  function dibujar() { if (MODO === "rec") { dibujarRec(); } else { dibujarVtr(); } }
  HD.cuadro(dibujar);
  $("pie").textContent = "Canal " + CANAL;

  /* botón Sincronizar: mide de nuevo el reloj y corrige al tiro (también se hace solo al abrir y cada 5 min) */
  function pintarSync(t) { $("sync").textContent = t; }
  function marcaSync() {
    var r = HD.reloj;
    $("sync").className = r.ok ? "ok" : "";
    pintarSync(r.ok ? "✓ Sincronizado" : "⟳ Sincronizar");
  }
  $("sync").onclick = function (e) {
    e.stopPropagation();
    $("sync").className = "trabajando"; pintarSync("Sincronizando…");
    HD.sincronizar(16).then(function () { con.reiniciar(); cache = {}; marcaSync(); }, marcaSync);
  };
  setInterval(marcaSync, 2000); setTimeout(marcaSync, 1500);

  /* ajuste fino por cuadros (calzar contra la pantalla del HyperDeck); queda guardado en este equipo */
  function fpsActual() { var d = con.ultimo("vtr") || con.ultimo("rec"); return (d && d.fps) || 59.94; }
  function pintarAjuste() {
    var c = Math.round(HD.ajuste() / (1000 / fpsActual()));
    $("ajTxt").textContent = c ? "Ajuste de esta pantalla: " + (c > 0 ? "+" : "") + c + " cuadro" + (Math.abs(c) === 1 ? "" : "s") : "";
  }
  function mover(n, e) { e.stopPropagation(); HD.ajuste(HD.ajuste() + n * 1000 / fpsActual()); con.reiniciar(); cache = {}; pintarAjuste(); }
  $("mas").onclick = function (e) { mover(1, e); };
  $("menos").onclick = function (e) { mover(-1, e); };
  pintarAjuste();

  function cambiar(m, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    MODO = m; try { localStorage.setItem("hd_modo", m); } catch (e) {}
    $("tVtr").className = "vtr" + (m === "vtr" ? " on" : ""); $("tRec").className = "rec" + (m === "rec" ? " on" : "");
    document.title = (m === "rec" ? "REC" : "VTR") + " · Contador HyperDeck";
    cache = {}; dibujar();
  }
  $("tVtr").onclick = function (e) { cambiar("vtr", e); };
  $("tRec").onclick = function (e) { cambiar("rec", e); };
  cambiar(MODO);

  // Pantalla encendida + pantalla completa al tocar
  function encendida() { try { if (navigator.wakeLock) navigator.wakeLock.request("screen")["catch"](function () {}); } catch (e) {} }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) encendida(); });
  document.body.addEventListener("click", function () {
    encendida();
    var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f && !document.fullscreenElement) try { f.call(el); } catch (e) {}
  });
  encendida();
})();
</script>
</body>
</html>
